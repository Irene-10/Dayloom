<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-page-node-id="HXk5LzwKu7niCxkaTFo88C">
<head data-page-node-id="s8sGaTEw6NYGbeHo5jQJzN">
<meta charset="UTF-8" data-page-node-id="y2CZp1IogSfKOV84Vtzecx" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="8B2S9xogQBBZFPRqA1HHF6" />
<meta name="theme-color" content="#f7faf9" />
<link rel="manifest" href="manifest.webmanifest" />
<title>日常工作台</title>
<style>
  /* ============================================================
     Design System — 日常工作台
     Tokens → components → modules. Light + dark themes.
     ============================================================ */
  /* ============================================================
     Design System — shadcn-style tokens (语义化)
     保留旧 token (--bg/--ink/--line/...) 作为底层 color-source，
     新增 shadcn 风格语义映射 + radius 阶梯，新组件统一用语义层。
     ============================================================ */
  :root{
    /* ——底层色板（color-source，全部按 WCAG 4.5:1+ 校准）—— */
    --bg-source:#f3f7f5;
    --bg2-source:#eaf1ee;
    --bg3-source:#dfe9e4;
    --ink-source:#172328;
    --ink2-source:#35454a;
    --muted-source:#65736f;
    --faint-source:#84918c;
    --line-source:#d7e2dc;
    --line2-source:#c7d5ce;
    --line3-source:#afc2b8;
    --accent-source:#244b5a;
    --accent2-source:#244b5a;
    --accent-soft:#e1eceb;
    --surface-blue:#eaf3f5;
    --surface-sage:#edf5ef;
    --surface-paper:#fcfefd;
    --green:#244b5a; --green-soft:#dbe5e5;
    --purple:#244b5a; --purple-soft:#dbe5e5;
    --amber:#8a704b; --amber-soft:#f0eadf;
    --red:#ad5558; --red-soft:#f6e7e6;
    --teal:#2f7d68; --teal-soft:#e3f0eb;
    --pink:#e5484d; --pink-soft:#fdeced;

    /* ——旧 token 兼容层（迁移期使用，组件可继续引用）—— */
    --bg:var(--bg-source);
    --bg-grad:var(--bg-source);
    --panel:#fcfefd; --panel-2:var(--bg2-source); --panel-3:var(--bg3-source);
    --ink:var(--ink-source); --ink-2:var(--ink2-source);
    --muted:var(--muted-source); --faint:var(--faint-source);
    --line:var(--line-source); --line-2:var(--line2-source); --line-3:var(--line3-source);
    --accent:var(--accent-source); --accent-ink:#244b5a; --accent-2:var(--accent2-source);
    --shadow:0 12px 30px rgba(36,75,90,.07);
    --shadow-sm:0 2px 8px rgba(36,75,90,.045);
    --shadow-lg:0 18px 48px rgba(20,45,53,.13);
    --ring:0 0 0 3px rgba(36,75,90,.14);

    /* ——shadcn 风格语义层（统一，新组件优先用这套）
        注：未暴露 --accent（避免与旧版蓝色 --accent 冲突；新组件改用 --secondary） —— */
    --background: var(--bg-source);
    --foreground: var(--ink-source);
    --card: #ffffff;
    --card-foreground: var(--ink-source);
    --popover: #ffffff;
    --popover-foreground: var(--ink-source);
    --primary: var(--accent-source);
    --primary-foreground: #ffffff;
    --secondary: var(--bg2-source);
    --secondary-foreground: var(--ink-source);
    /* 注意：此处不再定义 --muted。旧版 --muted 是「文字色」，与 shadcn 的
       --muted（背景色）同名冲突；一旦在此重定义会把全局文字冲成浅底。 */
    --muted-foreground: var(--muted-source);
    --destructive: #ad5558;
    --destructive-foreground: #ffffff;
    --border: var(--line-source);
    --input: var(--line2-source);
    --ring-fg: var(--accent-source);

    /* ——radius 阶梯（shadcn 风格，由 --radius 派生）—— */
    --radius:10px;
    --radius-sm:8px;
    --radius-md:10px;
    --radius-lg:14px;
    --radius-xl:16px;
    --radius-2xl:18px;
    --radius-3xl:20px;

    /* ——typography scale（shadcn 节奏）—— */
    --font-sans:"Aptos","Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
    --font-display:Georgia,"Noto Serif SC","Songti SC",SimSun,serif;
    --text-xs:12.5px; --text-sm:14px; --text-base:15.5px;
    --text-lg:17px; --text-xl:20px; --text-2xl:26px;
    --text-3xl:30px; --text-4xl:36px;
    --leading-tight:1.28; --leading-snug:1.45; --leading-normal:1.62; --leading-relaxed:1.78;

    /* ——spacing scale（8pt 友好）—— */
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:14px;
    --space-5:16px; --space-6:18px; --space-7:24px; --space-8:32px; --space-9:40px;

    /* ——layout grid & container（impeccable 8pt baseline + 对称铺满）—— */
    --container-max:1280px;
    --gutter:28px;
    --col-gap:20px;
    --row-gap:20px;
    --card-padding:20px;          /* 卡片内容内边距统一基准 */
    --section-gap:28px;           /* section 上方间距 */
    --title-gap:10px;             /* 标题 → 内容 */

    --font:var(--font-sans);
    --space:14px;
  }
  [data-theme="dark"]{
    --bg-source:#111718;
    --bg2-source:#192124;
    --bg3-source:#222c2f;
    --ink-source:#edf1ef;
    --ink2-source:#c6d0ce;
    --muted-source:#a8b4b0;
    --faint-source:#84928e;
    --line-source:#2b3739;
    --line2-source:#3a484b;
    --line3-source:#4b5d61;
    --accent-source:#8eb6bd;
    --accent2-source:#8eb6bd;
    --accent-soft:#21383e;
    --surface-blue:#1b2b30;
    --surface-sage:#1d2b26;
    --surface-paper:#192224;
    --green:#8eb6bd; --green-soft:#21383e;
    --purple:#8eb6bd; --purple-soft:#21383e;
    --amber:#f0a93b; --amber-soft:#332713;
    --red:#ff6b70; --red-soft:#3a1c1e;
    --teal:#6fc1a5; --teal-soft:#18352b;
    --pink:#ff6b70; --pink-soft:#3a1c1e;

    --bg:var(--bg-source);
    --bg-grad:var(--bg-source);
    --panel:#171f21; --panel-2:var(--bg2-source); --panel-3:var(--bg3-source);
    --ink:var(--ink-source); --ink-2:var(--ink2-source);
    --muted:var(--muted-source); --faint:var(--faint-source);
    --line:var(--line-source); --line-2:var(--line2-source); --line-3:var(--line3-source);
    --accent:var(--accent-source); --accent-ink:#a9cbd0; --accent-2:var(--accent2-source);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    --shadow-sm:0 1px 2px rgba(0,0,0,.45);
    --shadow-lg:0 16px 50px rgba(0,0,0,.6);
    --ring:0 0 0 4px rgba(109,139,255,.28);

    --background: var(--bg-source);
    --foreground: var(--ink-source);
    --card: #171f21;
    --card-foreground: var(--ink-source);
    --popover: #1b2528;
    --popover-foreground: var(--ink-source);
    --primary: var(--accent-source);
    --primary-foreground: #0e1014;
    --secondary: var(--bg2-source);
    --secondary-foreground: var(--ink-source);
    --muted-foreground: var(--muted-source);
    --destructive: #ff6b70;
    --destructive-foreground: #ffffff;
    --border: var(--line-source);
    --input: var(--line2-source);
    --ring-fg: var(--accent-source);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg-grad);background-attachment:fixed;color:var(--ink);font-size:var(--text-base);line-height:var(--leading-normal);font-weight:400;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  input,select,textarea{font-family:inherit;font-size:var(--text-sm);color:var(--ink)}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:8px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}

  /* —— impeccable：浏览器表面也由设计系统接管 —— */
  ::selection{background:color-mix(in srgb,var(--accent) 28%, transparent);color:var(--foreground)}
  input,select,textarea,button,label{caret-color:var(--accent)}
  /* 占位符统一用 muted（浏览器默认 54% 透明太浅） */
  input::placeholder,textarea::placeholder{color:var(--muted-foreground);opacity:1}
  /* 数字列用等宽对齐（impeccable: tabular-nums） */
  .nums,.bs-n,.stat-num,.cal-num,.pinfo .count,.count b{font-variant-numeric:tabular-nums}

  /* ---------- layout ---------- */
  #app{display:flex;min-height:100vh}
  #sidebar{width:252px;flex:0 0 252px;background:color-mix(in srgb,var(--panel) 88%, transparent);backdrop-filter:blur(14px);
    border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
  /* 主容器：固定 max-width 居中，左右对称 padding 承担 gutter */
  .main-inner{max-width:var(--container-max);width:100%;margin:0 auto;padding:28px var(--gutter) 90px}

  /* brand */
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:800;font-size:15px;letter-spacing:.2px}
  .brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;box-shadow:var(--shadow-sm)}
  .nav-group{margin-top:10px}
  .nav-label{font-size:10.5px;font-weight:800;letter-spacing:1.3px;color:var(--faint);text-transform:uppercase;padding:9px 10px 4px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-md);color:var(--muted);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;transition:background .12s,color .12s}
  .nav-item:hover{background:var(--panel-2);color:var(--ink)}
  .nav-item.active{background:linear-gradient(135deg,var(--accent-soft),var(--purple-soft));color:var(--accent-ink);font-weight:700;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%, transparent)}
  .nav-item .ico{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .nav-item .dot{width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:auto;box-shadow:0 0 0 3px var(--red-soft)}
  .sidebar-foot{margin-top:auto;padding:12px 8px 4px;font-size:11px;color:var(--faint)}

  /* topbar */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 72%, transparent);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);padding:15px max(var(--gutter), calc((100% - var(--container-max)) / 2));display:flex;align-items:center;gap:14px;
    /* 让 topbar 的内容与 main-inner 共用同一条容器线（宽屏也严格对齐） */
  }
  .topbar .greet{font-size:19px;font-weight:800;white-space:nowrap}
  .topbar .date{color:var(--muted);font-size:12.5px;margin-top:1px}
  .search{margin-left:auto;position:relative;flex:0 1 360px}
  .search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line-2);border-radius:var(--radius-md);background:var(--panel);outline:none;transition:border-color .15s, box-shadow .15s}
  .search input:focus{border-color:var(--accent);box-shadow:var(--ring)}
  .search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:var(--radius-md);font-weight:700;border:1px solid var(--line-2);background:var(--panel);white-space:nowrap;transition:transform .1s, box-shadow .15s, background .15s;box-shadow:var(--shadow-sm)}
  .btn:hover{background:var(--panel-2);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%, transparent)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
  .btn.ghost:hover{background:var(--panel-2)}
  .btn.sm{padding:7px 11px;border-radius:9px;font-size:13px}
  .btn.tiny{padding:5px 10px;border-radius:8px;font-size:12px}
  .icon-btn{width:40px;height:40px;border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);background:var(--panel);box-shadow:var(--shadow-sm);transition:background .15s}
  .icon-btn:hover{background:var(--panel-2)}

  /* ============================================================
     shadcn-style component anatomy（与现有 .btn/.pill/.icon-btn 兼容共存）
     ============================================================ */

  /* —— shadcn Button 变体 —— */
  .btn-primary{background:var(--primary);color:var(--primary-foreground);border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px color-mix(in srgb,var(--primary) 28%, transparent)}
  .btn-primary:hover{filter:brightness(1.05);box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px color-mix(in srgb,var(--primary) 38%, transparent);transform:translateY(-1px)}
  .btn-primary:active{transform:translateY(0)}
  .btn-secondary{background:var(--secondary);color:var(--secondary-foreground);border-color:var(--border);box-shadow:none}
  .btn-secondary:hover{background:color-mix(in srgb,var(--secondary) 75%, var(--foreground) 6%)}
  .btn-outline{background:transparent;color:var(--foreground);border:1px solid var(--border);box-shadow:none}
  .btn-outline:hover{background:var(--secondary);color:var(--foreground);border-color:color-mix(in srgb,var(--border) 60%, var(--foreground) 14%)}
  .btn-ghost{background:transparent;color:var(--foreground);border-color:transparent;box-shadow:none}
  .btn-ghost:hover{background:var(--secondary);color:var(--foreground)}
  .btn-destructive{background:var(--destructive);color:var(--destructive-foreground);border-color:transparent}
  .btn-destructive:hover{filter:brightness(1.05)}
  .btn-link{background:transparent;color:var(--primary);border:0;box-shadow:none;padding:0;text-decoration:none;height:auto}
  .btn-link:hover{text-decoration:underline;background:transparent}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:var(--radius);height:32px}
  .btn-lg{padding:10px 18px;font-size:15px;border-radius:var(--radius-md);height:44px}
  .btn-icon{width:40px;height:40px;padding:0;border-radius:var(--radius)}

  /* —— shadcn Input / Textarea / Label —— */
  .input,.textarea,.select{width:100%;display:flex;height:40px;padding:8px 12px;font-size:var(--text-base);line-height:1.5;color:var(--foreground);
    background:var(--card);border:1px solid var(--input);border-radius:var(--radius-md);outline:none;transition:border-color .15s, box-shadow .15s, background .15s}
  .input::placeholder,.textarea::placeholder{color:var(--muted-foreground)}
  .input:focus,.textarea:focus,.select:focus{border-color:var(--ring-fg);box-shadow:0 0 0 3px color-mix(in srgb, var(--ring-fg) 22%, transparent)}
  .input:disabled,.textarea:disabled,.select:disabled{cursor:not-allowed;opacity:.55}
  .textarea{min-height:80px;padding:10px 12px;resize:vertical;font-family:inherit;line-height:1.6}
  .select{appearance:none;padding-right:32px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b94a6' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:14px}
  .label{display:block;font-size:12px;font-weight:600;color:var(--foreground);margin-bottom:6px;letter-spacing:.2px}

  /* —— shadcn Card 解剖 —— */
  .card-soft{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 1px 2px rgba(20,30,55,.04),0 2px 8px rgba(20,30,55,.04)}
  .card-header{display:flex;flex-direction:column;gap:6px;padding:20px 22px 0}
  .card-title{font-weight:700;font-size:var(--text-lg);line-height:1.3;letter-spacing:-.01em;color:var(--card-foreground);margin:0}
  .card-description{font-size:var(--text-sm);color:var(--muted-foreground);line-height:1.5;margin:0}
  .card-content{padding:18px 22px}
  .card-footer{display:flex;align-items:center;gap:10px;padding:0 22px 20px}
  .card-divider{height:1px;background:var(--border);margin:0}

  /* —— shadcn Badge 变体（与 .pill 并存）—— */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;
    border:1px solid transparent;line-height:1.4;transition:background .15s, border-color .15s, color .15s}
  .badge-default{background:var(--primary);color:var(--primary-foreground)}
  .badge-secondary{background:var(--secondary);color:var(--secondary-foreground);border-color:var(--border)}
  .badge-outline{background:transparent;color:var(--foreground);border-color:var(--border)}
  .badge-destructive{background:color-mix(in srgb,var(--destructive) 12%, transparent);color:var(--destructive);border-color:color-mix(in srgb,var(--destructive) 28%, transparent)}
  .badge-muted{background:var(--secondary);color:var(--muted-foreground)}

  /* —— shadcn Empty 状态 —— */
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--card) 60%, var(--secondary) 40%)}
  .empty-state .es-icon{width:48px;height:48px;border-radius:var(--radius-lg);background:var(--secondary);color:var(--muted-foreground);display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:22px}
  .empty-state .es-title{font-weight:700;font-size:var(--text-lg);margin:0 0 6px;color:var(--card-foreground);letter-spacing:-.01em}
  .empty-state .es-desc{font-size:13.5px;color:var(--muted-foreground);margin:0 0 16px;max-width:340px;line-height:1.55}

  /* —— shadcn Separator —— */
  .sep{height:1px;background:var(--border);width:100%;margin:14px 0;border:0}

  /* —— shadcn Avatar —— */
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--secondary);color:var(--secondary-foreground);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 36px;border:1px solid var(--border);overflow:hidden}
  .avatar-sm{width:28px;height:28px;font-size:11.5px;flex-basis:28px}
  .avatar-lg{width:48px;height:48px;font-size:15px;flex-basis:48px}

  /* —— shadcn Tabs（强化 .seg）—— */
  .tabs-shdcn{display:inline-flex;align-items:center;gap:2px;padding:4px;background:color-mix(in srgb,var(--secondary) 85%,transparent);border:1px solid var(--border);border-radius:var(--radius-md)}
  .tabs-shdcn button{padding:6px 12px;border-radius:calc(var(--radius-md) - 2px);font-size:13px;font-weight:600;color:var(--muted-foreground);background:transparent;border:0;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
  .tabs-shdcn button:hover{color:var(--foreground)}
  .tabs-shdcn button.on{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05)}

  /* —— shadcn-style hover lift（非全局，仅 .lift 适用；与 .card 的 :hover 配合） —— */
  .lift{transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
  .lift:hover{transform:translateY(-1px);box-shadow:0 1px 2px rgba(20,30,55,.05),0 6px 18px rgba(20,30,55,.08)}

  .menu-btn{display:none}

  /* generic */
  h1,h2,h3{margin:0;letter-spacing:-.01em;color:var(--foreground)}
  h1{font-size:var(--text-2xl);font-weight:700;line-height:1.2}
  h2{font-size:var(--text-xl);font-weight:600;line-height:1.3}
  h3{font-size:var(--text-lg);font-weight:600;line-height:1.35}
  .page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
  .page-head .page-title{font-size:var(--text-2xl);font-weight:700;line-height:1.2;letter-spacing:-.02em;color:var(--foreground)}
  .page-head .page-desc{font-size:13.5px;color:var(--muted-foreground);line-height:1.55}
  /* —— 节奏：段落上方间距更大，下方更小（impeccable: more above than below） —— */
  .section-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-foreground);margin:var(--section-gap) 0 var(--title-gap);display:flex;align-items:center;gap:8px}
  .section-title:first-child{margin-top:8px}
  .section-title .sub{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted-foreground);font-size:12.5px}
  /* —— 卡片：impeccable —— 一次声明 elevation，只用 border（去掉双层 ghost effect） —— */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:none;padding:var(--card-padding)}
  .card.pad-0{padding:0}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
  .pill.blue{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 25%, transparent)}
  .pill.green{background:var(--green-soft);color:var(--green);border-color:color-mix(in srgb,var(--green) 28%, transparent)}
  .pill.purple{background:var(--purple-soft);color:var(--accent-2);border-color:color-mix(in srgb,var(--accent-2) 26%, transparent)}
  .pill.amber{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%, transparent)}
  .pill.red{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 28%, transparent)}
  .pill.gray,.pill.sm.gray{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
  .pill.sm{padding:2px 9px;font-size:11px;cursor:default}
  .tag{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);font-size:11px;color:var(--muted)}

  .bar{height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease}

  .focus-card{display:flex;align-items:center;gap:14px;padding:15px 17px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-sm)}
  .focus-rank{font-size:20px;font-weight:900;color:var(--accent);width:26px;text-align:center;flex:0 0 26px}
  .focus-body{flex:1;min-width:0}
  .focus-title{font-weight:700}
  .focus-meta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-2);flex:0 0 24px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--panel);transition:.12s}
  .check:hover{border-color:var(--accent)}
  .check.done{background:var(--green);border-color:var(--green);color:#fff}
  .prio-dot{width:8px;height:8px;border-radius:50%}

  .area{padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
  .area:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-2)}
  .area-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .area-ico{width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,var(--panel-2),var(--panel-3))}
  .area-name{font-weight:800;font-size:15px}
  .area-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .area-pct{margin-left:auto;font-weight:900;font-size:20px}
  .area-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}

  .week-grid{display:grid;grid-template-columns:90px repeat(7,1fr);gap:6px;align-items:center}
  .week-grid .wh{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
  .week-grid .wr{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600}
  .week-grid .wc{height:34px;border-radius:9px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:3px;cursor:pointer;border:1px solid transparent;transition:.12s}
  .week-grid .wc:hover{border-color:var(--line-2)}
  .week-grid .wc.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .wd{width:9px;height:9px;border-radius:50%}

  .up-item{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
  .up-item:last-child{border-bottom:none}
  .up-date{width:54px;flex:0 0 54px;text-align:center}
  .up-date .d{font-weight:800;font-size:18px}
  .up-date .m{font-size:10px;color:var(--muted);text-transform:uppercase}
  .up-body{flex:1}
  .up-title{font-weight:600}
  .up-src{font-size:12px;color:var(--muted);margin-top:2px}

  .list-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px;cursor:pointer;transition:.12s}
  .list-item:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
  .list-item .li-body{flex:1;min-width:0}
  .list-item .li-title{font-weight:600}
  .list-item .li-meta{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .li-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s}
  .list-item:hover .li-actions{opacity:1}
  .li-act{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid transparent;transition:.12s}
  .li-act:hover{background:var(--panel-2);color:var(--ink)}

  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
  .kcol{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:11px;display:flex;flex-direction:column;min-height:120px}
  .kcol.drop{border-color:var(--accent);background:var(--accent-soft)}
  .kcol-head{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:4px 6px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .kcol-head .kc-n{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:0 7px;font-size:11px;color:var(--muted)}
  .kcol-body{overflow-y:auto;overflow-x:hidden;max-height:var(--kmax,560px);padding:1px 2px 2px 1px;flex:1}
  .kcol-foot{padding-top:6px}
  .kadd{width:100%;text-align:left;padding:8px 9px;border-radius:9px;color:var(--muted);font-size:12.5px;border:1px dashed var(--line-2);transition:.12s}
  .kadd:hover{background:var(--panel);color:var(--ink);border-color:var(--accent)}
  .ktask{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:11px;margin-bottom:8px;box-shadow:var(--shadow-sm);cursor:grab;position:relative;transition:.12s}
  .ktask:active{cursor:grabbing}
  .ktask:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
  .ktask:hover .kt-acts{opacity:1}
  .ktask.dragging{opacity:.4}
  .ktask .kt-top{display:flex;align-items:flex-start;gap:8px}
  .ktask .kt-title{font-weight:600;font-size:13.5px;flex:1;min-width:0;word-break:break-word}
  .ktask.is-done .kt-title{text-decoration:line-through;color:var(--muted);font-weight:500}
  .ktask .kt-meta{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center}
  .ktask .kt-acts{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0;transition:opacity .15s;background:var(--panel);border-radius:7px}
  .ktask.ov{border-color:var(--red);background:var(--red-soft)}
  .kt-node{display:inline-block;max-width:100%;padding:1px 7px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kanban.compact .ktask{padding:6px 9px;margin-bottom:5px;box-shadow:none}
  .kanban.compact .ktask .kt-title{font-size:12.5px}
  .kanban.compact .ktask .kt-meta{margin-top:4px;gap:4px}
  .kanban.compact .pill{padding:1px 6px;font-size:10.5px}
  .ti{width:100%;border:1px solid var(--accent);border-radius:7px;padding:5px 7px;font-weight:600;font-size:13.5px;outline:none;box-shadow:var(--ring)}

  .fbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius-lg);padding:10px 12px;box-shadow:var(--shadow-sm);margin-bottom:14px}
  .fbar input[type=text],.fbar select{padding:8px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel-2);outline:none;font-size:13px;max-width:230px;transition:.15s}
  .fbar input[type=text]:focus,.fbar select:focus{border-color:var(--accent);box-shadow:var(--ring);background:var(--panel)}

  .loop3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  .loop-box{border:1px solid var(--line);border-radius:var(--radius-lg);padding:13px 15px;background:var(--panel);display:flex;flex-direction:column}
  .loop-head{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;margin-bottom:10px}
  .loop-lit{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .loop-lit:last-child{border-bottom:none}
  .loop-syn{margin-bottom:10px}
  .loop-k{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
  .loop-v{font-size:12.5px;line-height:1.7;background:var(--panel-2);border-radius:9px;padding:9px 11px;white-space:pre-line}
  .loop-out{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}
  .loop-out:last-child{border-bottom:none}
  .tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:4px}

  @media (max-width:960px){ .loop3{grid-template-columns:1fr} }
  /* .seg 统一定义见下（shadcn-style segmented tabs） */
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700;cursor:pointer;user-select:none}

  .swim{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--panel);margin-bottom:12px;overflow:hidden}
  .swim-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);cursor:pointer}
  .swim-head:hover{background:var(--panel-3)}
  .swim-name{font-weight:800;font-size:13.5px}
  .swim-body{padding:12px}
  .swim .kanban{gap:10px}
  .swim .kcol{background:var(--bg)}

  .chap{display:flex;align-items:center;gap:12px;padding:9px 0}
  .chap-name{width:190px;flex:0 0 190px;font-weight:600;font-size:13px}
  .chap-bar{flex:1;min-width:80px}
  .chap-pct{width:46px;text-align:right;font-weight:800;font-size:13px}
  .chap-n{width:64px;flex:0 0 64px;text-align:right;font-size:11.5px;color:var(--muted)}

  .outline{display:flex;flex-direction:column}
  .onode{border-radius:10px}
  .orow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;position:relative}
  .orow:hover{background:var(--panel-2)}
  .orow.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .orow.sel{background:var(--accent-soft)}
  .orow:hover .oacts{opacity:1}
  .otw{width:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;color:var(--faint);border-radius:5px;cursor:pointer}
  .otw:hover{background:var(--line);color:var(--ink)}
  .odot{width:16px;flex:0 0 16px;text-align:center;font-size:12px}
  .otitle{font-weight:600;font-size:13.5px;flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .onode.lv0 > .orow > .otitle{font-size:14.5px;font-weight:800}
  .onode.lv2 > .orow > .otitle,.onode.lv3 > .orow > .otitle{font-weight:500;color:var(--ink-2)}
  .obar{width:110px;flex:0 0 110px}
  .opct{width:38px;flex:0 0 38px;text-align:right;font-size:11.5px;font-weight:800;color:var(--muted)}
  .ocnt{width:52px;flex:0 0 52px;text-align:right;font-size:11px;color:var(--faint)}
  .oacts{display:flex;gap:1px;opacity:0;transition:opacity .15s}
  .oact{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint)}
  .oact:hover{background:var(--line);color:var(--ink)}
  .okids{margin-left:14px;padding-left:10px;border-left:1px dashed var(--line-2)}
  .oempty{color:var(--faint);font-size:12px;padding:6px 8px 6px 38px}

  .pipeline{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
  .pcol{flex:1 0 130px;min-width:130px;padding:0 6px}
  .pcol-head{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;text-align:center;padding:6px 0;border-bottom:2px solid var(--line-2);margin-bottom:8px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);padding:11px;margin-bottom:9px;box-shadow:var(--shadow-sm);cursor:grab;transition:.12s}
  .pcard:hover{box-shadow:var(--shadow);border-color:var(--line-2)}
  .pcard .pc-title{font-weight:800;font-size:13px}
  .pcard .pc-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .pcard.drag{opacity:.4}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .ucard{padding:15px;border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .1s,box-shadow .1s,border-color .1s}
  .ucard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
  .ucard h4{margin:0 0 6px;font-size:14.5px}
  .stars{color:var(--amber);letter-spacing:1px;font-size:13px}
  .stars .off{color:var(--line-3)}

  table.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
  table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:11px 13px;background:var(--panel-2);border-bottom:1px solid var(--line);font-weight:800}
  table.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tbody tr:hover td{background:var(--panel-2)}

  .cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .cal-nav{display:flex;gap:6px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:4px 0}
  .cal-cell{min-height:92px;border:1px solid var(--line);border-radius:var(--radius-md);padding:6px;background:var(--panel);cursor:pointer;overflow:hidden;transition:.12s}
  .cal-cell:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
  .cal-cell.dim{background:var(--panel-2);color:var(--faint)}
  .cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .cal-cell.drop{background:var(--accent-soft)}
  .cal-num{font-size:12px;font-weight:800;margin-bottom:4px}
  .cal-ev{font-size:10.5px;padding:2px 5px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel-2)}
  /* shadcn-style segmented tabs（替换第二份 .seg 重复定义） */
  .seg{display:inline-flex;background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius-md);padding:3px;gap:2px}
  .seg button{padding:6px 13px;border-radius:calc(var(--radius-md) - 2px);font-size:13px;font-weight:600;color:var(--muted-foreground);background:transparent;border:0;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
  .seg button:hover{color:var(--foreground)}
  .seg button.on{background:var(--card);color:var(--foreground);box-shadow:0 1px 2px rgba(20,30,55,.04),0 1px 3px rgba(20,30,55,.05)}

  .overlay{position:fixed;inset:0;background:rgba(15,18,26,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:100;overflow-y:auto}
  .modal{background:var(--panel);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:520px;padding:24px;border:1px solid var(--line)}
  .modal h3{font-size:18px;margin-bottom:16px;font-weight:800}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);outline:none;transition:.15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:var(--ring);background:var(--panel)}
  .field textarea{resize:vertical;min-height:64px}
  .field-row{display:flex;gap:12px}
  .field-row > *{flex:1}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .cklist{border:1px solid var(--line-2);border-radius:10px;padding:6px;background:var(--panel-2)}
  .ckrow{padding:5px 8px;border-radius:8px;cursor:pointer}
  .ckrow:hover{background:var(--panel)}

  .sr-group{margin-bottom:18px}
  .sr-group h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:7px}

  #toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--ink);color:var(--panel);padding:11px 17px;border-radius:var(--radius-md);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:tin .2s ease}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .empty{padding:42px;text-align:center;color:var(--muted)}
  .stat-num{font-size:26px;font-weight:900}
  .stat-lbl{font-size:12px;color:var(--muted)}
  .hint{font-size:12px;color:var(--ink-2);background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%, transparent);padding:10px 13px;border-radius:var(--radius-md);margin-bottom:14px;line-height:1.6}

  /* ---------- 每日论文推送 feed ---------- */
  .feed-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
  .feed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .feed-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;transition:transform .15s ease,box-shadow .15s ease}
  .feed-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .feed-rail{width:62px;flex:0 0 62px;background:linear-gradient(160deg,var(--accent-soft),var(--purple-soft));border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;text-align:center}
  .feed-date{font-size:17px;font-weight:900;color:var(--accent-ink);line-height:1.15}
  .feed-wd{font-size:11px;color:var(--muted);margin-top:4px}
  .feed-body{padding:12px 14px;flex:1;min-width:0}
  .feed-meta{display:flex;gap:6px;margin-bottom:6px}
  .feed-paper{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
  .feed-paper:first-of-type{border-top:none}
  .feed-kind{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px}
  .k-classic{background:var(--amber)} .k-latest{background:var(--accent)} .k-other{background:var(--muted)}
  .feed-pmain{flex:1;min-width:0}
  .feed-ptitle{font-weight:600;font-size:13.5px;line-height:1.35;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .feed-porig{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feed-pmeta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
  .feed-pact{flex:0 0 auto;display:flex;align-items:center}
  .btn.tiny{padding:4px 9px;border-radius:7px;font-size:12px}
  .pill.sm{padding:2px 8px;font-size:11px;cursor:pointer}
  .feed-nav{display:flex;align-items:center;gap:12px}
  .feed-nav .arrow{width:38px;height:38px;border-radius:var(--radius-md);border:1px solid var(--line-2);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);box-shadow:var(--shadow-sm);transition:.12s}
  .feed-nav .arrow:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .feed-nav .arrow:disabled{opacity:.35;cursor:not-allowed}
  .feed-nav .datebox{text-align:center;min-width:160px}
  .feed-nav .datebox .d1{font-size:17px;font-weight:800;letter-spacing:.3px}
  .feed-nav .datebox .d2{font-size:11.5px;color:var(--muted);margin-top:1px}

  /* ---------- 文献库详细表格（飞书多维表格镜像） ---------- */
  .lib-tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg)}
  .lib-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1180px}
  .lib-tbl th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.4px;color:var(--muted);padding:10px;background:var(--panel-2);border-bottom:1px solid var(--line);font-weight:800;white-space:nowrap}
  .lib-tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
  .lib-tbl tr:last-child td{border-bottom:none}
  .lib-tbl tbody tr{cursor:pointer}
  .lib-tbl tbody tr:hover td{background:var(--panel-2)}
  .lib-tbl .ttl{font-weight:600;color:var(--ink);line-height:1.4}
  .lib-tbl .zh{color:var(--muted);font-size:11.5px;margin-top:2px}
  .lib-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lib-expand td{background:var(--panel-2)!important}
  .lib-detail{display:grid;grid-template-columns:108px 1fr;gap:7px 14px;padding:8px 6px;font-size:12.5px;line-height:1.65}
  .lib-detail .k{color:var(--muted);font-weight:700}
  .lib-badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:800;background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%, transparent)}
  .filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .filters select,.filters input{padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel)}
  .filters input:focus,.filters select:focus{border-color:var(--accent);box-shadow:var(--ring)}
  .syncbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,var(--accent-soft),var(--purple-soft));border:1px solid color-mix(in srgb,var(--accent) 24%, transparent);border-radius:var(--radius-lg);padding:14px 17px}
  .syncbar .big{font-size:15px;font-weight:800}
  .explain{font-size:12.5px;line-height:1.7;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:13px 16px;margin:10px 0 4px}
  .explain b{color:var(--ink)}
  .explain .step{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--ink)}

  /* ---------- NEW: literature selection + pagination ---------- */
  .sel-check{width:18px;height:18px;border-radius:6px;border:2px solid var(--line-3);flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:var(--panel);transition:.12s;font-size:12px;color:#fff}
  .sel-check.on{background:var(--accent);border-color:var(--accent)}
  .lib-tbl td.cb, .lib-tbl th.cb{width:38px;text-align:center}
  .pager{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .pager button{min-width:34px;height:34px;padding:0 9px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);font-weight:700;font-size:13px;box-shadow:var(--shadow-sm);transition:.12s}
  .pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .pager button.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent}
  .pager button:disabled{opacity:.4;cursor:not-allowed}
  .pager .pinfo{color:var(--muted);font-size:12.5px;font-weight:600;margin:0 6px}
  .selbar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:color-mix(in srgb,var(--panel) 92%, transparent);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px 16px;margin-top:14px;box-shadow:var(--shadow)}
  .selbar .count{font-weight:800;font-size:14px}
  .selbar .count b{color:var(--accent-ink)}
  .selbar .grow{flex:1}

  /* ---------- NEW: association results ---------- */
  .assoc{display:grid;gap:12px;margin-top:12px}
  .assoc-card{border:1px solid var(--line);border-radius:var(--radius-lg);padding:15px 17px;background:var(--panel);box-shadow:var(--shadow-sm)}
  .assoc-card h4{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .assoc-card .badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink)}
  .assoc-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .assoc-row:last-child{border-bottom:none}
  .assoc-row .k{width:96px;flex:0 0 96px;color:var(--muted);font-weight:700;font-size:12px}
  .assoc-row .v{flex:1;line-height:1.65}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
  .chip.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 25%, transparent)}
  .chip.grn{background:var(--green-soft);color:var(--green);border-color:color-mix(in srgb,var(--green) 28%, transparent)}
  .chip.am{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%, transparent)}
  .chip.pu{background:var(--purple-soft);color:var(--accent-2);border-color:color-mix(in srgb,var(--accent-2) 26%, transparent)}

  /* ---------- NEW: diary module ---------- */
  .diary-editor{background:linear-gradient(135deg,var(--accent-soft),var(--purple-soft));border:1px solid color-mix(in srgb,var(--accent) 22%, transparent);border-radius:16px;padding:16px 18px;margin-bottom:18px}
  .diary-editor .ed-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
  .diary-editor input,.diary-editor textarea{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;outline:none;transition:.15s}
  .diary-editor input:focus,.diary-editor textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
  .diary-editor textarea{width:100%;min-height:110px;resize:vertical;line-height:1.7}
  .diary-editor .ed-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .diary-editor .ed-row input[type=date]{max-width:170px}
  .timeline{position:relative;padding-left:22px}
  .timeline:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--accent-2));border-radius:2px;opacity:.5}
  .tl-item{position:relative;margin-bottom:18px}
  .tl-dot{position:absolute;left:-22px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);box-shadow:0 0 0 4px var(--bg)}
  .tl-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
  .tl-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .tl-date{font-weight:800;font-size:14px}
  .tl-wd{font-size:12px;color:var(--muted)}
  .tl-sec{display:flex;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13px;line-height:1.65}
  .tl-sec:first-of-type{border-top:none}
  .tl-sec .sk{width:34px;flex:0 0 34px;font-size:17px;text-align:center}
  .tl-sec .sv{flex:1}
  .tl-sec .sl{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
  .tl-note{margin-top:10px;font-size:13px;color:var(--ink-2);background:var(--panel-2);border-radius:9px;padding:9px 11px;line-height:1.7}
  .tl-acts{margin-left:auto;display:flex;gap:4px}

  /* ---------- NEW: xhs linkage ---------- */
  .xhs-link{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,var(--pink-soft),var(--purple-soft));border:1px solid color-mix(in srgb,var(--pink) 22%, transparent);border-radius:var(--radius-lg);padding:14px 17px;margin-bottom:16px}
  .xhs-link .ic{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ff7a8a,var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:20px}
  .xhs-link .lx{font-weight:800;font-size:14.5px}
  .xhs-link .ls{font-size:12.5px;color:var(--muted);margin-top:1px}
  .xhs-link .grow{flex:1}
  .xhs-draft{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--panel);box-shadow:var(--shadow-sm);margin-bottom:14px}
  .xhs-draft .dh{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .xhs-draft .dt{font-weight:800;font-size:13.5px}
  .xhs-draft .topic{font-size:12px;color:var(--accent-2);font-weight:700}
  .xhs-draft .db{padding:13px 15px;font-size:13px;line-height:1.75;white-space:pre-line}
  .xhs-draft .dtags{display:flex;gap:6px;flex-wrap:wrap;padding:0 15px 13px}

  /* theme toggle */
  .theme-toggle{width:40px;height:40px;border-radius:var(--radius-md);border:1px solid var(--line-2);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:.12s}
  .theme-toggle:hover{background:var(--panel-2)}

  /* responsive */
  @media (max-width:920px){
    #sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
    #sidebar.open{transform:none}
    .menu-btn{display:inline-flex}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:55;display:none}
    .scrim.show{display:block}
  }
  @media (max-width:760px){
    .main-inner{padding:16px 14px 90px}
    .topbar{padding:12px 14px}
    .topbar .greet{font-size:15px}
    .search{flex-basis:auto;min-width:0}
    .topbar .date{display:none}
    .kanban{grid-template-columns:1fr}
    .week-grid{grid-template-columns:60px repeat(7,1fr);gap:3px}
    .week-grid .wr{font-size:10px}
    .cards{grid-template-columns:1fr}
    .field-row{flex-direction:column;gap:0}
    .area-pct{font-size:17px}
    .obar,.ocnt{display:none}
    .chap-name{width:120px;flex:0 0 120px;font-size:12px}
    .chap-n{display:none}
    .kcol-body{max-height:none}
    .fbar input[type=text]{max-width:none;flex:1 1 140px}
  }
  @media (min-width:761px) and (max-width:1100px){
    .kanban{grid-template-columns:repeat(2,1fr)}
    .proj-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  /* ============================================================
     Convergence additions — banner / ring / heat / checkin /
     mood / projects / copy board / knowledge / week board
     ============================================================ */
  textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--radius-md);padding:10px 12px;background:var(--panel);color:var(--ink);resize:vertical;font-family:inherit;line-height:1.55;outline:none;font-size:13.5px}
  textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
  .grow{flex:1}

  /* banner：栅格容器，左右对称铺满（impeccable：避免硬编码宽度） */
  .banner{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:24px;align-items:stretch;padding:24px 26px;border-radius:var(--radius-lg);
    background:linear-gradient(118deg, color-mix(in srgb,var(--accent) 16%, var(--card)), color-mix(in srgb,var(--accent-2) 14%, var(--card)));
    border:1px solid color-mix(in srgb,var(--accent) 22%, transparent);box-shadow:none;color:var(--foreground)}
  .banner-glow{position:absolute;width:260px;height:260px;right:-50px;top:-80px;border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb,var(--accent-2) 45%, transparent), transparent 70%);filter:blur(18px);opacity:.55;pointer-events:none}
  .banner-left{position:relative;z-index:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .banner-hi{font-size:15px;font-weight:700;color:var(--muted-foreground);letter-spacing:.2px}
  .banner-q{font-size:21px;font-weight:700;line-height:1.4;margin:8px 0 8px;color:var(--card-foreground)}
  .banner-date{font-size:12.5px;color:var(--muted-foreground)}
  .banner-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,auto);gap:8px 28px;align-items:end;margin-top:18px;padding-top:16px;border-top:1px dashed color-mix(in srgb,var(--accent) 24%, transparent)}
  .bs{min-width:64px}
  .bs-n{font-size:24px;font-weight:800;line-height:1;color:var(--card-foreground);font-variant-numeric:tabular-nums}
  .bs-l{font-size:11px;color:var(--muted-foreground);margin-top:4px;letter-spacing:.3px}

  /* 任务列表卡片：外层 6px，行内 .list-item 自带边框与内边距（内容起点 ≈ 21px，与 20px 基准对齐） */
  .list-card{padding:6px}
  .list-card .list-item{margin-bottom:8px}
  .list-card .list-item:last-child{margin-bottom:0}

  /* ring (circular progress) */
  .ring{width:86px;height:86px;border-radius:50%;flex:0 0 86px;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--p,0)*1%), var(--panel-3) 0);position:relative}
  .ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--panel)}
  .ring span{position:relative;font-weight:800;font-size:16px;color:var(--ink)}

  /* heat (checkin 7-day) */
  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .heat-col{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 6px}
  .heat-col.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .heat-dot{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;border:1px solid var(--line-2);background:var(--panel);filter:grayscale(.6);opacity:.55}
  .heat-dot.on{filter:none;opacity:1;border-color:transparent}
  .heat-d{font-size:10.5px;color:var(--muted)}

  /* checkin grid + mood（5 项固定 5 列，避免 auto-fill 断成 4+1） */
  .ci-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .ci-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 8px;border-radius:var(--radius-lg);background:var(--panel-2);border:1px solid var(--line);transition:.14s;color:var(--ink-2)}
  .ci-btn:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .ci-btn.on{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 22%, transparent)}
  .ci-e{font-size:26px;line-height:1}
  .ci-l{font-size:12.5px;font-weight:700}
  .mood-row{display:flex;gap:10px;flex-wrap:wrap}
  .mood{font-size:30px;line-height:1;padding:9px 12px;border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--panel-2);transition:.14s}
  .mood:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
  .mood.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--ring)}

  /* projects */
  /* 项目卡片网格：auto-fill 桌面 3 列、平板 2 列、手机 1 列（impeccable：等宽 8pt gutter） */
  .proj-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--col-gap)}
  /* 项目卡片：去掉双层 elevation；统一 padding；用更可读的对比 */
  .proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:none;transition:transform .14s ease, border-color .14s ease}
  .proj-card:hover{border-color:color-mix(in srgb,var(--accent) 32%, var(--border));transform:translateY(-1px)}
  .proj-top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
  .proj-ico{width:42px;height:42px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 42px}
  .proj-name{font-weight:700;font-size:14.5px;color:var(--foreground);letter-spacing:-.01em}
  .proj-sub{font-size:11.5px;color:var(--muted-foreground);margin-top:2px;font-variant-numeric:tabular-nums}
  .proj-pct{font-size:22px;font-weight:800;line-height:1;color:var(--foreground);font-variant-numeric:tabular-nums}
  .proj-card .bar{height:6px;background:var(--secondary);border-radius:99px;overflow:hidden}
  .proj-card .bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
  .uboard{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--col-gap);align-items:start}
  .ucol{background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:11px;display:flex;flex-direction:column;min-height:120px}
  .ucol.drop{border-color:var(--accent);background:var(--accent-soft)}

  /* copy board */
  .copy-board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
  .copy-col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:11px;display:flex;flex-direction:column;height:150px;min-height:0}
  .copy-col.drop{border-color:var(--accent);background:var(--accent-soft)}
  /* 文案看板紧凑化：列高统一、正文区只露约 2 条标题、超出滚动 */
  .copy-col .kcol-body{max-height:none}
  .copy-col .ktask{padding:7px 10px;margin-bottom:6px;box-shadow:none}
  .copy-col .ktask .kt-title{font-size:13px;padding-right:52px}
  .copy-card{padding:10px}
  .copy-card .kt-title{font-size:13px}

  /* knowledge */
  .kb-add{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
  .kb-list{display:flex;flex-direction:column;gap:11px}
  .kb-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:9px}
  .kb-text{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .kb-foot{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
  .kb-foot .li-act{margin-left:auto}

  /* week board (calendar) */
  .calendar-wrap{margin-bottom:18px}
  .week-board{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
  .wb-col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px;display:flex;flex-direction:column;min-height:160px;transition:.12s}
  .wb-col.drop{background:var(--accent-soft);border-color:var(--accent)}
  .wb-head{font-size:12.5px;font-weight:800;color:var(--muted);padding:2px 4px 9px}
  .wb-head.today{color:var(--accent-ink)}
  .wb-body{display:flex;flex-direction:column;gap:7px;flex:1}
  .wb-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 9px;box-shadow:var(--shadow-sm);cursor:grab;font-size:12.5px}
  .wb-card:active{cursor:grabbing}
  .wb-t{margin-top:4px;font-weight:600;line-height:1.4;word-break:break-word}

  /* responsive */
  @media (max-width:960px){ .copy-board{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:820px){
    .banner{grid-template-columns:1fr;gap:18px;padding:20px 22px}
    .banner-stats{grid-template-columns:repeat(3,1fr);gap:8px 0}
    .banner-q{font-size:17px}
  }
  @media (max-width:760px){
    .home-grid{ grid-template-columns:1fr; }
    .home-cols{ grid-template-columns:1fr; }
    .today-cols{ grid-template-columns:1fr; }
    .ci-grid{ grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); }
    .heat{overflow-x:auto}
    .heat-col{min-width:60px}
    .proj-grid{grid-template-columns:1fr 1fr}
    .uboard{grid-template-columns:1fr}
    .copy-board{grid-template-columns:1fr 1fr}
    .week-board{grid-template-columns:1fr}
    .wb-col{min-height:auto}
  }
  @media (max-width:480px){ .proj-grid{grid-template-columns:1fr} .copy-board{grid-template-columns:1fr} }
  /* ===== 收敛版新增组件 ===== */
  /* Home：banner 右侧快速添加 */
  /* banner-right = 网格第二列，不再硬编码宽度；自填满 */
  .banner-right{min-width:0;display:flex;align-items:stretch}
  .home-add{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; width:100%; max-width:100%; box-shadow:none; display:flex;flex-direction:column;gap:8px}
  .ha-cap{ font-size:11px; color:var(--muted-foreground); font-weight:600; letter-spacing:.4px; text-transform:uppercase }
  .home-add input{ width:100%; padding:9px 11px; border:1px solid var(--input); border-radius:var(--radius-md); background:var(--card); color:var(--foreground); font-size:14px; box-sizing:border-box; min-height:40px;outline:none;transition:border-color .15s,box-shadow .15s}
  .home-add input:focus{ border-color:var(--ring-fg); box-shadow:0 0 0 3px color-mix(in srgb,var(--ring-fg) 18%, transparent) }
  .ha-row{ display:flex; gap:8px; }
  .ha-row select{ flex:1; min-width:0; padding:8px 10px; border:1px solid var(--input); border-radius:var(--radius-md); background:var(--card); color:var(--foreground); font-size:13px; box-sizing:border-box; min-height:40px;outline:none }

  /* Home：本周 + 打卡 两栏，统一 8pt gutter */
  .home-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--col-gap); margin:var(--row-gap) 0; }
  .home-week, .home-ck{ padding:var(--card-padding); }
  .ring.sm{ width:74px; height:74px; font-size:14px; }
  .ring.sm::after{ width:56px; height:56px; }

  /* 紧凑打卡 */
  .ck-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .ck-chip{ display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border:1px solid var(--line); border-radius:999px; background:var(--bg); color:var(--muted); font-size:12.5px; cursor:pointer; transition:.15s; }
  .ck-chip .ck-e{ font-size:14px; }
  .ck-chip.on{ font-weight:600; }
  .ck-grid{ margin-top:10px; display:grid; grid-template-columns:18px repeat(7,1fr); gap:5px 4px; align-items:center; }
  .ck-gl{ font-size:13px; text-align:center; }
  .ck-cell{ height:14px; border-radius:4px; background:var(--line-2); display:block; }
  .ck-cell.on{ box-shadow:0 0 0 1px rgba(255,255,255,.15) inset; }

  /* Home：今日 / 近3天 左右两栏，统一 8pt gutter；列内卡片拉伸，底边严格对齐 */
  .home-cols{ display:grid; grid-template-columns:1fr 1fr; gap:var(--col-gap); margin-top:var(--row-gap); align-items:stretch }
  .home-col{ display:flex; flex-direction:column; min-width:0; }
  .home-col > .card{ flex:1; }

  /* Today：两栏紧凑，同上 gutter；末卡拉伸补齐高度 */
  .today-cols{ display:grid; grid-template-columns:1fr 1fr; gap:var(--col-gap); align-items:stretch }
  .today-col{ display:flex; flex-direction:column; min-width:0; }
  .today-col > .card:last-child{ flex:1; }

  /* 数据：迷你柱状图 */
  .mini-bar svg{ width:100%; }

  /* ===== 数据页（impeccable：叙事段落卡片，不堆 hero-metric） ===== */
  .stats-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--col-gap);margin-bottom:var(--row-gap)}
  .stats-row:last-child{margin-bottom:0}
  .stats-cell{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
  .stats-cell.wide{grid-column:span 1}
  .stats-cell-h{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-foreground);margin:0}
  .stats-cell-b{font-size:13.5px;line-height:1.65;color:var(--foreground);opacity:.85;margin:0}
  .stats-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .stats-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--secondary);color:var(--foreground);font-size:13px}
  .stats-pill b{font-size:15px;font-weight:700;color:var(--foreground);font-variant-numeric:tabular-nums}
  .stats-pill i{font-size:11px;font-style:normal;color:var(--muted-foreground)}
  .stats-pill em{font-size:11.5px;font-style:normal;color:var(--muted-foreground);margin-left:2px}
  .stats-pill.warn{background:color-mix(in srgb,var(--destructive) 8%, transparent);border-color:color-mix(in srgb,var(--destructive) 28%, transparent)}
  .stats-pill.warn b{color:var(--destructive)}
  .stats-meta{font-size:11.5px;color:var(--muted-foreground);margin-top:6px}

  /* 打卡类型清单 */
  .ck-tally{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .ck-tally-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:var(--radius-md);background:var(--secondary);font-size:13px}
  .ck-tally-e{font-size:16px;line-height:1;text-align:center}
  .ck-tally-l{color:var(--foreground)}
  .ck-tally-row b{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}

  /* 项目列表行 */
  .stats-list{display:flex;flex-direction:column;gap:10px}
  .stats-list-row{display:grid;grid-template-columns:34px 1fr 72px;gap:14px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)}
  .stats-list-row .proj-ico{width:34px;height:34px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:17px}
  .stats-list-body{min-width:0}
  .stats-list-h{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
  .stats-list-h span{font-weight:600;color:var(--foreground)}
  .stats-list-h b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .stats-list-meta{font-size:11.5px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;text-align:right}

  /* 优先级条 */
  .pri-bars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .pri-bar{display:grid;grid-template-columns:80px 1fr 36px;gap:10px;align-items:center;font-size:13px}
  .pri-k{font-weight:600;font-size:12.5px}
  .pri-bar-bg{display:block;height:8px;background:var(--secondary);border-radius:99px;overflow:hidden}
  .pri-bar-bg i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease}
  .pri-bar b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;color:var(--foreground)}

  /* ===== 设置页（impeccable：每节一块卡片，header + body 分离） ===== */
  .settings-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:var(--row-gap)}
  .settings-card:last-child{margin-bottom:0}
  .settings-h{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:14px}
  .settings-b{display:flex;flex-direction:column;gap:14px}
  .settings-actions{display:flex;gap:10px;flex-wrap:wrap}
  .settings-card code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--secondary);padding:2px 6px;border-radius:5px;color:var(--foreground)}

  /* destructive 按钮（与现有 .btn 系统兼容） */
  .btn.destructive{background:transparent;color:var(--destructive);border-color:color-mix(in srgb,var(--destructive) 36%, transparent)}
  .btn.destructive:hover{background:color-mix(in srgb,var(--destructive) 8%, transparent);border-color:var(--destructive)}

  /* 兼容老 stat-card 调用（避免其它视图引用 statCard() 时崩） */
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;min-width:130px;flex:1}
  .stat-num{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .stat-lbl{font-size:11.5px;color:var(--muted-foreground);margin-top:6px;letter-spacing:.4px;text-transform:uppercase;font-weight:700}

  /* 移动端：home-cols / today-cols 已在上面 760px 段处理；这里只补 banner 子项 */
  @media (max-width:820px){
    .banner-right{ width:100%; }
    .stats-row{grid-template-columns:1fr}
  }

  /* 工具类：块间上间距（stats 页进度条用） */
  .mt{margin-top:10px}

  /* ===== 项目详情（下拉 / 概览 / 单项目规划） ===== */
  .proj-detail-head{ display:flex; align-items:center; gap:12px; margin:6px 0 4px; flex-wrap:wrap; }
  .pd-title{ display:flex; align-items:center; gap:10px; }
  .pd-title .proj-ico{ width:38px; height:38px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-size:19px; }
  .proj-select{ appearance:none; padding:8px 30px 8px 12px; border:1px solid var(--input); border-radius:var(--radius-md); background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b94a6' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 10px center; color:var(--foreground); font-size:13.5px; min-width:230px; cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s}
  .proj-select:focus{ border-color:var(--ring-fg); box-shadow:0 0 0 3px color-mix(in srgb,var(--ring-fg) 18%, transparent) }
  .pd-title .proj-name{ font-weight:700; }

  /* ===== 文案下方大编辑器 ===== */
  .copy-editor{ margin-top:18px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow); }
  .ce-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .ce-row{ display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .ce-row .ce-title{ flex:1; min-width:200px; font-size:15px; font-weight:600; }
  .ce-stage{ min-width:120px; }
  .ce-tags{ width:100%; margin-bottom:10px; }
  .copy-body{ width:100%; min-height:340px; resize:vertical; line-height:1.8; font-size:14.5px; padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font-family:inherit; }
  .copy-body:focus{ outline:none; border-color:var(--accent); }
  .ce-foot{ display:flex; gap:10px; align-items:center; margin-top:12px; }

  /* 任务列表沿用 .list-item / .pill 样式 */

  /* —— 知识库 —— */
  .kb-wrap{--kb-accent:#30cf79;--kb-soft:#e8fbf1;display:grid;grid-template-columns:minmax(250px,290px) minmax(0,920px);gap:34px;align-items:flex-start;justify-content:center}
  .kb-side{min-width:0;display:flex;flex-direction:column;gap:22px;position:sticky;top:20px}
  .kb-main{min-width:0;display:flex;flex-direction:column;gap:18px}
  .kb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:4px 2px 8px}
  .kb-stat{text-align:left;padding:0;background:transparent;border:0}
  .kb-stat b{display:block;font-size:31px;line-height:1.15;color:var(--ink);font-weight:720;letter-spacing:-.8px}
  .kb-stat span{display:block;margin-top:5px;font-size:13px;color:var(--muted)}
  .kb-tagbar{background:transparent;border:0;padding:0}
  .kb-taghead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:13px;color:var(--muted)}
  .kb-all{font-weight:650;cursor:pointer}.kb-all.on{color:var(--kb-accent)}
  .kb-taglist{display:flex;flex-direction:column;gap:3px;margin-top:3px}
  .kb-tagitem{display:flex;align-items:center;justify-content:space-between;border-radius:9px;padding:7px 8px;font-size:13.5px;min-height:34px}
  .kb-tagitem:hover{background:var(--panel)}
  .kb-tagitem.on{background:var(--kb-soft);color:#179d58}
  .kb-tagname{flex:1;min-width:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kb-tagname em{font-style:normal;font-size:11px;color:var(--muted);margin-left:5px}
  .kb-tagops{display:none;gap:2px}.kb-tagitem:hover .kb-tagops{display:flex}
  .kb-tree-row{display:flex;align-items:center;min-width:0;flex:1}.kb-tree-toggle{width:22px;height:24px;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;transition:transform .15s}.kb-tree-toggle.open{transform:rotate(90deg)}.kb-tree-spacer{width:22px;flex:none}
  .kb-compose{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 24px 16px;box-shadow:0 2px 12px rgba(31,45,38,.04)}
  .kb-compose textarea{width:100%;min-height:115px;border:0;background:transparent;font-size:16px;line-height:1.75;resize:vertical;outline:0;color:var(--ink)}
  .kb-compose textarea::placeholder{color:#a6aaa8;font-size:17px}
  .kb-tagchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .kb-chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:8px;border:1px solid transparent;background:#eef5ff;color:#5282df;font-size:12px;cursor:pointer;transition:all .12s}
  .kb-chip:hover,.kb-chip.on{background:var(--kb-soft);color:#179d58;border-color:#bcebd1}
  .kb-feed{display:flex;flex-direction:column;gap:14px}
  .kb-card{background:var(--panel);border:1px solid transparent;border-radius:20px;padding:20px 24px;box-shadow:0 2px 12px rgba(31,45,38,.035);display:flex;flex-direction:column;gap:11px}
  .kb-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
  .kb-ops{ display:flex; gap:4px; opacity:0; transition:opacity .15s; } .kb-card:hover .kb-ops{ opacity:1; }
  .kb-text{font-size:15px;line-height:1.85;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  .kb-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
  .tag.link{color:#5282df;background:#eef5ff;border-color:transparent;padding:3px 8px;border-radius:7px;cursor:pointer}
  .tag.link:hover{ text-decoration:underline; }

  /* —— 2026 desktop refinement：沉静的学术工作台 —— */
  body{font-size:15px}
  #sidebar{width:232px;flex-basis:232px;padding:18px 12px}
  .nav-item{width:100%;text-align:left;font-size:14px}
  .main-inner{padding-top:24px}
  .page-head .page-title{font-size:24px;font-weight:750}
  .page-head .page-desc{font-size:14px}
  .banner{padding:20px 22px;background:linear-gradient(118deg,color-mix(in srgb,var(--accent) 11%,var(--card)),color-mix(in srgb,var(--accent-2) 8%,var(--card)))}
  .banner-glow{opacity:.32}
  .banner-q{font-size:18px}
  .card:hover{transform:none}
  .empty.compact{padding:24px}

  .kb-tools{display:flex;flex-direction:column;gap:8px}
  .search-lite{height:40px;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--card);color:var(--muted-foreground)}
  .search-lite:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
  .search-lite input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:var(--foreground);font-size:14px}
  .kb-tools select{height:40px;border:1px solid var(--input);border-radius:var(--radius-md);background:var(--card);color:var(--foreground);padding:0 10px}
  .kb-compose-foot{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
  .kb-tag-input{height:36px;min-width:210px;flex:1;border:0;background:transparent;outline:0;color:var(--ink);font-size:13px}
  .kb-send{margin-left:auto;width:44px;height:36px;border:0;border-radius:11px;background:var(--kb-accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 12px rgba(48,207,121,.22)}
  .kb-send:hover{filter:brightness(.96)}
  .kb-text{font-size:15px;line-height:1.75}
  .kb-ops.always{opacity:1}
  .li-act.on{color:var(--amber);background:var(--amber-soft)}

  .knowledge-digest{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:28px 32px;box-shadow:none;max-width:980px}
  .digest-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
  .digest-head h2{font-family:Georgia,"Songti SC",serif;font-size:25px;line-height:1.35;margin:6px 0 0;font-weight:700;letter-spacing:.01em}
  .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent-ink);font-weight:700}
  .local-badge{font-size:12px;color:var(--green);background:var(--green-soft);padding:5px 9px;border-radius:999px;white-space:nowrap}
  .digest-copy{max-width:760px;padding:20px 0 8px}
  .digest-copy p{font-family:Georgia,"Songti SC",serif;font-size:16px;line-height:1.95;margin:0 0 16px;color:var(--ink-2)}
  .digest-copy .digest-lead{font-size:17px;color:var(--ink)}
  .digest-copy .digest-close{padding:14px 16px;background:var(--secondary);border-radius:var(--radius-md);font-family:var(--font-sans);font-size:14px;line-height:1.75}
  .digest-refs{border-top:1px solid var(--border);padding-top:18px}
  .digest-refs h3{font-size:13px;margin:0 0 10px;color:var(--muted-foreground)}
  .digest-ref{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;padding:9px 10px;border-radius:var(--radius-md)}
  .digest-ref:hover{background:var(--secondary)}
  .digest-ref>span{color:var(--accent);font-weight:700}
  .digest-ref div{display:flex;flex-direction:column;gap:2px;min-width:0}
  .digest-ref b{font-size:13.5px;font-weight:600}
  .digest-ref small{font-size:12px;color:var(--muted-foreground)}
  .digest-actions{display:flex;gap:8px;margin-top:18px}
  .empty-digest{display:flex;align-items:center;justify-content:space-between;max-width:none;padding:22px 24px}
  .empty-digest p{margin:4px 0 0;color:var(--muted-foreground);font-size:13px}
  .review-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .review-summary span{padding:8px 10px;border-radius:var(--radius-md);background:var(--secondary);font-size:12.5px;color:var(--muted-foreground)}
  .review-summary b{font-size:15px;color:var(--foreground)}
  .storage-health{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius-md);background:var(--secondary)}
  .storage-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .storage-health p{margin:3px 0 0;font-size:12.5px;color:var(--muted-foreground)}

  /* —— Fresh minimal theme: quiet mint, crisp hierarchy, restrained depth —— */
  html{background:var(--background)}
  body{background:var(--background);color:var(--foreground);font-size:15px;letter-spacing:.005em}
  #app{min-height:100dvh}
  #sidebar{
    width:220px;flex-basis:220px;height:100dvh;padding:20px 14px;
    background:var(--panel);backdrop-filter:none;border-right:1px solid var(--border);gap:4px
  }
  #main{height:100dvh}
  .main-inner{padding:30px var(--gutter) 88px}
  .brand{gap:11px;padding:5px 8px 20px;font-size:15px;font-weight:750;letter-spacing:-.01em}
  .brand .logo{
    width:34px;height:34px;border-radius:11px;background:var(--accent);box-shadow:none;
    font-size:14px;font-weight:800
  }
  .nav-item{
    min-height:42px;padding:10px 11px;border-radius:11px;color:var(--muted);
    font-weight:590;transition:background .16s ease,color .16s ease,transform .12s ease
  }
  .nav-item:hover{background:var(--secondary);color:var(--foreground)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;box-shadow:none}
  .nav-item:active{transform:scale(.985)}
  .sidebar-foot{padding:14px 8px 2px;font-size:12px;color:var(--faint)}
  .topbar{
    min-height:70px;padding:14px max(var(--gutter),calc((100% - var(--container-max))/2));
    background:color-mix(in srgb,var(--background) 94%,transparent);border-bottom:1px solid var(--border);
    backdrop-filter:blur(10px)
  }
  .topbar .greet{font-size:18px;font-weight:750;letter-spacing:-.02em}
  .topbar .date{font-size:13px;color:var(--faint)}
  .search input,.search-lite,.kb-tools select,.home-add input,.ha-row select,textarea,input,select{
    border-color:var(--input);background:var(--card);border-radius:var(--radius-md)
  }
  .search input{min-height:42px;box-shadow:none}
  .search input:focus,.search-lite:focus-within,textarea:focus,input:focus,select:focus{
    border-color:var(--accent);box-shadow:var(--ring)
  }
  .btn,.icon-btn{box-shadow:none;border-color:var(--border);background:var(--card)}
